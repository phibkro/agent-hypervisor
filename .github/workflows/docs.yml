# Build the docs site (with Context Mapper diagrams and Alloy results generated from the models)
# and deploy it to GitHub Pages on every push to main.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Vite and the TanStack Start prerenderer run on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Context Mapper, PlantUML and Alloy are Java tools; PlantUML lays out with Graphviz.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Cache model tools
        uses: actions/cache@v6
        with:
          path: docs/.cache/tools
          key: model-tools-${{ hashFiles('docs/scripts/artifacts.ts') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run types:check

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build (validates the CML model and runs the Alloy checks)
        run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
